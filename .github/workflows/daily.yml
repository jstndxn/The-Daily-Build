name: Print today's edition

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 6 a.m. Pacific in summer, 5 a.m. in winter
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]        # redeploy the page when you edit it (doesn't re-collect)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect stories
        if: github.event_name != 'push'
        run: python fetch.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          IMAGE_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save the edition to the archive
        if: github.event_name != 'push'
        run: |
          git config user.name "daily-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Edition for $(TZ=America/Los_Angeles date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
