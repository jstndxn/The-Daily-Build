<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Daily Build</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F5F1;
    --ink: #1B1A18;
    --muted: #625E57;
    --rule: #CDC9C0;
    --accent: #8A2A1E;
    --display: "Old Standard TT", "Georgia", "Times New Roman", serif;
    --text: "Newsreader", "Iowan Old Style", "Georgia", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17171A;
      --ink: #E9E6DF;
      --muted: #A39E94;
      --rule: #3B3A37;
      --accent: #E0907F;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1.0625rem/1.55 var(--text);
    font-optical-sizing: auto;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }
  a:focus-visible, button:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .page { max-width: 76rem; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2.5rem) 3rem; }

  /* masthead */
  .masthead { text-align: center; padding-top: 1.25rem; }
  .ears { display: flex; justify-content: space-between; gap: 1rem; font-style: italic; font-size: .8125rem; color: var(--muted); }
  .title {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2.75rem, 10vw, 6.25rem);
    line-height: 1; letter-spacing: -.02em;
    margin: .6rem 0 .35rem;
  }
  .motto { font-style: italic; color: var(--muted); margin: 0 auto .9rem; max-width: 34em; font-size: .9375rem; }
  .dateline {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
    border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink);
    padding: .4rem 0; font-size: .875rem;
  }
  .dateline .d { font-weight: 600; }
  .dateline .l { text-align: left; color: var(--muted); }
  .dateline .r { text-align: right; color: var(--muted); }
  .desks { display: flex; justify-content: center; flex-wrap: wrap; gap: .25rem 1.75rem; padding: .55rem 0; border-bottom: 1px solid var(--rule); }
  .desks button {
    font: 500 .9375rem var(--text); color: var(--ink); background: none; border: 0; padding: .2rem 0; cursor: pointer;
  }
  .desks button:hover { color: var(--accent); }

  /* front page */
  .front { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0 2.25rem; padding: 1.75rem 0; border-bottom: 1px solid var(--ink); }
  .lead .kicker { margin-bottom: .5rem; }
  .lead h2 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(1.9rem, 4.2vw, 3.1rem); line-height: 1.08; letter-spacing: -.01em;
    margin: 0 0 .9rem; text-wrap: balance;
  }
  .lead .deck { font-size: 1.1875rem; line-height: 1.5; max-width: 34em; }
  .also { border-left: 1px solid var(--rule); padding-left: 2.25rem; }
  .also h2 { font: italic 400 1rem var(--text); color: var(--muted); margin: 0 0 .25rem; }

  /* stories */
  .story { border-top: 1px solid var(--rule); padding-top: .85rem; min-width: 0; }
  .also .story:first-of-type { border-top: 0; padding-top: .25rem; }
  .kicker { font: 600 .8125rem var(--text); font-variant: small-caps; letter-spacing: .04em; color: var(--accent); margin: 0 0 .3rem; }
  .story h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.2; margin: 0 0 .45rem; text-wrap: balance; overflow-wrap: anywhere; }
  .story.major h3 { font-size: clamp(1.5rem, 2.6vw, 1.95rem); line-height: 1.12; }
  .deck { margin: 0 0 .6rem; overflow-wrap: anywhere; }
  .story .deck { font-size: 1rem; color: var(--ink); }
  .grid .story:not(.major) .deck, .also .deck { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .byline { font-size: .875rem; color: var(--muted); margin: 0 0 .25rem; }
  .tally { font-size: .875rem; color: var(--muted); margin: 0 0 1rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .9rem; }
  .votes { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 1.05rem; font-variant-numeric: lining-nums tabular-nums; }
  .lead .votes { font-size: 1.6rem; }
  .tally a { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }

  /* sections */
  .desk { padding-top: 2.25rem; }
  .desk-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .25rem 1rem; border-top: 3px solid var(--ink); padding-top: .5rem; margin-bottom: 1rem; }
  .desk-head h2 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; margin: 0; }
  .desk-head p { margin: 0; font-size: .875rem; font-style: italic; color: var(--muted); }
  .desk-head p a { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 0 2rem; }
  @media (min-width: 52rem) { .grid .story.major { grid-column: span 2; grid-row: span 2; } }
  .notice { font-style: italic; color: var(--muted); border-top: 1px solid var(--rule); padding-top: .85rem; max-width: 40em; }

  .edition-notice { text-align: center; padding: 4rem 1rem; max-width: 34em; margin: 0 auto; }
  .edition-notice h2 { font-family: var(--display); font-size: 1.75rem; margin: 0 0 .5rem; }

  footer { margin-top: 3rem; border-top: 3px double var(--ink); padding-top: 1rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; font-size: .875rem; color: var(--muted); }
  footer label { display: inline-flex; gap: .5rem; align-items: center; }
  footer select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); padding: .2rem .4rem; }

  @media (max-width: 46rem) {
    .front { grid-template-columns: 1fr; }
    .also { border-left: 0; padding-left: 0; border-top: 1px solid var(--ink); padding-top: 1rem; margin-top: .5rem; }
    .also .story:first-of-type { border-top: 0; }
    .dateline { grid-template-columns: 1fr; text-align: center; gap: .1rem; }
    .dateline .l, .dateline .r { text-align: center; }
    .ears .ear-r { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="ears"><span id="ear-l"></span><span class="ear-r" id="ear-r"></span></div>
    <h1 class="title" id="title">The Daily Build</h1>
    <p class="motto" id="motto"></p>
    <div class="dateline">
      <span class="l" id="dl-l"></span>
      <span class="d" id="dl-d"></span>
      <span class="r" id="dl-r"></span>
    </div>
    <nav class="desks" id="desks" aria-label="Sections"></nav>
  </header>

  <main id="main"></main>

  <footer id="footer" hidden>
    <span id="colophon"></span>
    <label>Past editions <select id="archive"></select></label>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k === "on") for (const [ev, fn] of Object.entries(v)) node.addEventListener(ev, fn);
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);
  return node;
}

const num = (n) => Number(n).toLocaleString("en-US");
const plural = (n, word) => `${num(n)} ${word}${n === 1 ? "" : "s"}`;
const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);

function longDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}
function postedAt(iso, tz) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toLocaleString("en-US", { weekday: "long", hour: "numeric", minute: "2-digit", timeZone: tz });
}

async function getJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path} returned ${res.status}`);
  return res.json();
}

function showNotice(title, body) {
  $("main").replaceChildren(el("section", { class: "edition-notice" }, el("h2", { text: title }), el("p", { text: body })));
  $("dl-d").textContent = longDate(new Date().toISOString().slice(0, 10));
}

/* ---------- story pieces ---------- */

function byline(item, tz) {
  const parts = [];
  if (item.author) parts.push(`By u/${item.author}`);
  const when = postedAt(item.created, tz);
  if (when) parts.push(parts.length ? `posted ${when}` : `Posted ${when}`);
  return parts.length ? el("p", { class: "byline", text: parts.join(", ") }) : null;
}

function tally(item) {
  const bits = [];
  if (item.score != null) {
    bits.push(el("span", {}, el("span", { class: "votes", text: num(item.score) }), ` ${item.score === 1 ? "upvote" : "upvotes"}`));
  }
  if (item.comments != null && safeUrl(item.url)) bits.push(el("a", { href: item.url, text: plural(item.comments, "comment") }));
  const link = safeUrl(item.link);
  if (link && item.domain && !/^(self\.|i\.redd\.it|v\.redd\.it|reddit\.com)/.test(item.domain)) {
    bits.push(el("a", { href: link, text: `Visit ${item.domain}` }));
  }
  return bits.length ? el("p", { class: "tally" }, bits) : null;
}

function story(item, tz, { major = false, kicker } = {}) {
  const href = safeUrl(item.url);
  const k = kicker ?? item.flair;
  return el("article", { class: major ? "story major" : "story" },
    k ? el("p", { class: "kicker", text: k }) : null,
    el("h3", {}, href ? el("a", { href, text: item.title }) : item.title),
    item.excerpt ? el("p", { class: "deck", text: item.excerpt }) : null,
    byline(item, tz),
    tally(item));
}

function leadStory(item, section, tz) {
  const href = safeUrl(item.url);
  return el("article", { class: "lead" },
    el("p", { class: "kicker", text: section.title }),
    el("h2", {}, href ? el("a", { href, text: item.title }) : item.title),
    item.excerpt ? el("p", { class: "deck", text: item.excerpt }) : null,
    byline(item, tz),
    tally(item));
}

function periodWords(p) {
  return { day: "the past day", week: "the past week", month: "the past month" }[p] || `the past ${p}`;
}

function deskSection(sec, tz) {
  const head = el("div", { class: "desk-head" },
    el("h2", { text: sec.title }),
    sec.source ? el("p", {}, "Most upvoted in ",
      safeUrl(sec.source_url) ? el("a", { href: sec.source_url, text: sec.source }) : sec.source,
      sec.period ? ` over ${periodWords(sec.period)}` : "",
      sec.method === "rss" ? " (scores unavailable today)" : "") : null);

  let body;
  if (sec.status === "error") {
    body = el("p", { class: "notice", text: `This section couldn’t be collected this morning (${sec.error}). It will try again tomorrow, or you can run the workflow from the Actions tab now.` });
  } else if (!sec.items.length) {
    body = el("p", { class: "notice", text: sec.min_score ? `No posts reached ${plural(sec.min_score, "upvote")} over ${periodWords(sec.period)}.` : "No new posts in this section today." });
  } else {
    body = el("div", { class: "grid" }, sec.items.map((it, i) => story(it, tz, { major: i === 0 })));
  }
  return el("section", { class: "desk", id: `desk-${sec.id}` }, head, body);
}

/* ---------- edition ---------- */

let DATES = [];

function render(ed, date) {
  const tz = ed.timezone || "UTC";
  document.title = `${ed.title} for ${longDate(ed.date)}`;
  $("title").textContent = ed.title;
  $("motto").textContent = ed.motto || "";

  const n = DATES.length - DATES.indexOf(date);
  $("ear-l").textContent = `Edition no. ${num(n)}`;
  const printed = new Date(ed.generated_at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: tz, timeZoneName: "short" });
  $("ear-r").textContent = `Printed at ${printed}`;
  $("dl-d").textContent = longDate(ed.date);

  const live = ed.sections.filter((s) => s.status === "ok" && s.items.length);
  const total = ed.sections.reduce((a, s) => a + s.items.length, 0);
  $("dl-l").textContent = `${plural(ed.sections.length, "section")}, ${num(total)} ${total === 1 ? "story" : "stories"}`;
  $("dl-r").textContent = DATES[0] === date ? "Today’s edition" : "From the archive";

  $("desks").replaceChildren(...ed.sections.map((s) =>
    el("button", { type: "button", text: s.title, on: { click: () => $(`desk-${s.id}`).scrollIntoView() } })));

  const main = [];
  if (live.length) {
    // Lead: the day's single most upvoted story. Sidebar: the top story from each other section.
    let leadSec = live[0];
    for (const s of live) if ((s.items[0].score ?? -1) > (leadSec.items[0].score ?? -1)) leadSec = s;
    const others = live.filter((s) => s !== leadSec).map((s) => story(s.items[0], tz, { kicker: s.title }));
    if (leadSec.items[1]) others.push(story(leadSec.items[1], tz, { kicker: leadSec.title }));
    main.push(el("section", { class: "front", "aria-label": "Front page" },
      leadStory(leadSec.items[0], leadSec, tz),
      el("aside", { class: "also" }, el("h2", { text: "Also in this edition" }), others)));
  }
  for (const s of ed.sections) main.push(deskSection(s, tz));
  $("main").replaceChildren(...main);

  $("colophon").textContent = `Collected from Reddit at ${printed}. Headlines link to the original discussions.`;
  $("archive").value = date;
  $("footer").hidden = false;
}

function currentDate() {
  const h = decodeURIComponent(location.hash.slice(1));
  return DATES.includes(h) ? h : DATES[0];
}

async function load(date) {
  try {
    render(await getJSON(`data/${date}.json`), date);
    window.scrollTo({ top: 0 });
  } catch (e) {
    showNotice("This edition couldn’t be opened", `The file for ${date} is missing or damaged (${e.message}). Pick another date from the archive.`);
  }
}

async function boot() {
  if (location.protocol === "file:") {
    return showNotice("Open this page from a web server",
      "Browsers block pages opened straight from disk from reading the data folder. Use the GitHub Pages address, or run “python3 -m http.server” in this folder and open http://localhost:8000.");
  }
  try { DATES = (await getJSON("data/index.json")).dates || []; } catch { DATES = []; }
  if (!DATES.length) {
    return showNotice("The first edition hasn’t been printed yet",
      "In your GitHub repository, open the Actions tab, choose “Print today’s edition” and press Run workflow. The page fills in a minute later, and after that it prints itself every morning.");
  }
  $("archive").replaceChildren(...DATES.map((d) => el("option", { value: d, text: longDate(d) })));
  $("archive").addEventListener("change", (e) => {
    const want = e.target.value === DATES[0] ? "" : e.target.value;
    if (decodeURIComponent(location.hash.slice(1)) === want) load(currentDate());
    else location.hash = want;
  });
  addEventListener("hashchange", () => load(currentDate()));
  load(currentDate());
}

boot();
</script>
</body>
</html>
